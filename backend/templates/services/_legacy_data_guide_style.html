<style>
:root{--legacy-bg:#eef5fa;--legacy-panel:#fff;--legacy-text:#26384a;--legacy-muted:#758596;--legacy-blue:#116fa8;--legacy-blue-dark:#3f5c76;--legacy-blue-selected:#6f9fc7;--legacy-cyan:#13c7cc;--legacy-line:#cbd6df;--legacy-row:#f1f4f6;--legacy-shadow:0 2px 9px rgba(38,56,74,.10);--legacy-radius:14px}
*{box-sizing:border-box}html{direction:rtl;scroll-behavior:smooth}body{margin:0;background:var(--legacy-bg);color:var(--legacy-text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.65;font-size:15px}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}
.legacy-app{min-height:100vh;display:grid;grid-template-columns:310px minmax(0,1fr);direction:rtl}.legacy-sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#f7f9fa;border-left:1px solid #c4cfd8;box-shadow:-2px 0 8px rgba(24,45,65,.05);z-index:50;padding:0 0 18px}.legacy-brand{padding:14px 16px;border-bottom:1px solid var(--legacy-line);background:#fff}.legacy-brand-title{font-size:18px;font-weight:900;color:var(--legacy-blue)}.legacy-brand-sub{font-size:11px;color:var(--legacy-muted);margin-top:2px}.legacy-menu{padding:8px 0}.legacy-menu-section{margin:0}.legacy-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:45px;padding:9px 15px;background:var(--legacy-blue-dark);color:#fff;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid #324b61;font-size:17px;font-weight:900;cursor:pointer}.legacy-section-head .chev{font-size:18px;color:#b8c8d7;transition:.18s}.legacy-menu-section[open] .chev{transform:rotate(180deg)}.legacy-item{display:flex;align-items:center;gap:11px;min-height:49px;padding:8px 13px 8px 10px;background:#eef1f3;border-bottom:1px solid #d2dae1;color:#314658;font-weight:800;font-size:16px}.legacy-item:hover{background:#e5eef5}.legacy-item.active{background:var(--legacy-blue-selected);color:#fff;border-inline-start:4px solid var(--legacy-cyan);padding-inline-start:9px}.legacy-item .menu-icon{width:25px;flex:0 0 25px;text-align:center;color:#476076;font-size:20px;line-height:1}.legacy-item.active .menu-icon{color:var(--legacy-cyan)}.legacy-item .menu-label{flex:1}.legacy-item .count{font-size:11px;background:#d7e2eb;border-radius:999px;padding:2px 7px;color:#3c5368}.legacy-item.active .count{background:rgba(255,255,255,.18);color:#fff}
.legacy-main{min-width:0;overflow-x:hidden;padding:0 22px 28px}.legacy-mobilebar{display:none}.legacy-breadcrumb{position:sticky;top:0;z-index:20;margin:0 -22px 18px;padding:12px 20px;background:rgba(238,245,250,.95);backdrop-filter:blur(7px);border-bottom:1px solid #d1dde5;font-size:17px;font-weight:900;color:var(--legacy-text)}.legacy-breadcrumb .sep{color:#7f92a4;padding:0 5px}.legacy-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:17px}.legacy-page-head h1{margin:0;color:var(--legacy-blue);font-size:27px;line-height:1.35}.legacy-page-head p{margin:5px 0 0;color:var(--legacy-muted);font-size:13px}.legacy-actions{display:flex;gap:8px;flex-wrap:wrap}.legacy-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 15px;border:1px solid #aebdcc;border-radius:11px;background:#fff;color:var(--legacy-text);font-weight:900;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}.legacy-btn.primary{background:#267fb2;border-color:#267fb2;color:#fff}.legacy-btn.secondary{background:#e8eef3;color:#29445b}.legacy-btn.danger{background:#fff1ef;border-color:#efc5bf;color:#ae291d}.legacy-btn.small{min-height:34px;padding:5px 10px;font-size:12px}
.legacy-card{background:var(--legacy-panel);border:1px solid var(--legacy-line);border-radius:var(--legacy-radius);box-shadow:var(--legacy-shadow);padding:18px;margin-bottom:14px}.legacy-card.flat{border-radius:9px}.legacy-title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.legacy-title-row h2,.legacy-title-row h3{margin:0;color:var(--legacy-blue)}.legacy-title-row h2{font-size:22px}.legacy-title-row h3{font-size:18px}.legacy-muted{font-size:12px;color:var(--legacy-muted)}.legacy-info{padding:13px 15px;border:1px solid #bddbe8;background:#dff1f8;color:#2e5d70;border-radius:10px;font-size:14px;margin:0 0 14px}.legacy-warning{padding:12px 14px;border:1px solid #efc9c4;background:#fae8e6;color:#9c5149;border-radius:10px;font-size:13px}.legacy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 15px}.legacy-full{grid-column:1/-1}.legacy-field label{display:block;margin-bottom:6px;font-size:17px;color:var(--legacy-blue);font-weight:900}.legacy-required{color:#d6241a;margin-right:2px}.legacy-field input,.legacy-field select,.legacy-field textarea,.legacy-search{width:100%;min-height:52px;padding:8px 13px;border:1px solid #c7d3dc;border-radius:15px;background:#fff;color:var(--legacy-text);outline:none;box-shadow:inset 0 1px 2px rgba(36,59,80,.03)}.legacy-field textarea{min-height:94px;resize:vertical}.legacy-field input:focus,.legacy-field select:focus,.legacy-field textarea:focus,.legacy-search:focus{border-color:#75a7c8;box-shadow:0 0 0 3px rgba(36,127,178,.10)}.legacy-field .help{font-size:11px;color:var(--legacy-muted);margin-top:5px}.legacy-checkbox-line{display:flex;align-items:center;gap:9px;min-height:52px;padding:10px 12px;border:1px solid #d2dbe2;border-radius:12px;background:#fff;font-weight:800}.legacy-checkbox-line input{width:20px;height:20px;accent-color:#1684b6}
.legacy-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.legacy-stat{background:#fff;border:1px solid var(--legacy-line);border-radius:12px;padding:14px;box-shadow:var(--legacy-shadow)}.legacy-stat span{display:block;color:var(--legacy-muted);font-size:12px}.legacy-stat b{display:block;color:var(--legacy-blue);font-size:25px;margin-top:4px}.legacy-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.legacy-toolbar .legacy-search{flex:1;min-width:220px}
.legacy-table-wrap{overflow:auto;border:1px solid var(--legacy-line);border-radius:10px;background:#fff}.legacy-table{width:100%;min-width:760px;border-collapse:collapse}.legacy-table th,.legacy-table td{padding:11px 10px;text-align:right;border-bottom:1px solid #e7edf1;vertical-align:middle;font-size:13px}.legacy-table th{background:#eef3f6;color:#4c657a;font-size:12px;white-space:nowrap}.legacy-table tr:last-child td{border-bottom:0}.legacy-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}.legacy-pill.ok{background:#e5f6ef;color:#168160}.legacy-pill.off{background:#f8e8e6;color:#ad2d23}.legacy-code{direction:ltr;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#eef2f5;border-radius:7px;padding:3px 6px;font-size:11px;display:inline-block}
.legacy-accordion{border:1px solid #c9d6df;border-radius:11px;overflow:hidden;background:#fff;margin-bottom:11px}.legacy-accordion>summary{list-style:none;cursor:pointer;padding:12px 15px;background:#edf2f5;color:#385369;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:space-between}.legacy-accordion>summary::-webkit-details-marker{display:none}.legacy-accordion .inside{padding:13px}.legacy-field-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.legacy-field-group{border:1px solid #ccd7df;border-radius:10px;overflow:hidden;background:#fff}.legacy-field-group>summary{list-style:none;cursor:pointer;background:var(--legacy-blue-dark);color:#fff;padding:10px 12px;font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.legacy-field-group>summary::-webkit-details-marker{display:none}.legacy-field-list{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#fafcfd}.legacy-check{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid #ccd5dc;border-radius:9px;background:#fff;color:#344a5e;font-size:13px;font-weight:800;min-width:0}.legacy-check input{width:19px;height:19px;margin:0;accent-color:#1782b2}.legacy-check.hidden{display:none}
.legacy-side-by-side{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:15px}.legacy-chip-row{display:flex;flex-wrap:wrap;gap:7px}.legacy-chip{padding:6px 9px;border-radius:999px;background:#eef2f5;border:1px solid #d8e0e6;font-size:11px}.legacy-provider{border:1px solid #ccd7df;border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}.legacy-provider-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#edf2f5}.legacy-provider-body{padding:12px 14px}.legacy-provider-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.legacy-paths{border:1px solid #d1dbe2;border-radius:9px;margin-top:10px;overflow:hidden}.legacy-path-row{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-bottom:1px solid #edf1f4;font-size:12px}.legacy-path-row:last-child{border-bottom:0}.legacy-sticky{position:sticky;bottom:10px;z-index:15;margin-top:13px;padding:9px;background:rgba(255,255,255,.95);border:1px solid #cad5de;border-radius:12px;box-shadow:0 5px 20px rgba(35,58,79,.10);display:flex;gap:8px;flex-wrap:wrap}.legacy-empty{padding:25px;text-align:center;color:var(--legacy-muted)}
@media(max-width:1000px){.legacy-app{display:block}.legacy-sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:min(87vw,320px);height:100dvh;transform:translateX(110%);transition:transform .22s ease;box-shadow:-14px 0 35px rgba(30,53,73,.25)}.legacy-sidebar.open{transform:translateX(0)}.legacy-main{padding:0 13px 22px}.legacy-mobilebar{display:flex;position:sticky;top:0;z-index:40;margin:0 -13px 12px;padding:9px 10px;background:rgba(238,245,250,.96);backdrop-filter:blur(8px);border-bottom:1px solid #cbd7df;align-items:center;justify-content:space-between;gap:8px}.legacy-menu-button{width:42px;height:42px;border:1px solid #c4d0d9;border-radius:11px;background:#fff;color:#2f526d;font-size:20px;display:grid;place-items:center}.legacy-mobile-title{font-size:14px;font-weight:900;color:var(--legacy-blue);flex:1;text-align:center}.legacy-mobile-home{width:42px;height:42px;border:1px solid #c4d0d9;border-radius:11px;background:#fff;display:grid;place-items:center;color:#2f526d}.legacy-drawer-overlay{position:fixed;inset:0;background:rgba(17,36,54,.44);z-index:35;opacity:0;pointer-events:none;transition:.22s}.legacy-drawer-overlay.open{opacity:1;pointer-events:auto}.legacy-breadcrumb{margin:0 -13px 13px;padding:10px 12px}.legacy-page-head{display:block}.legacy-actions{margin-top:10px}.legacy-actions .legacy-btn{flex:1}.legacy-stats{grid-template-columns:repeat(2,1fr)}.legacy-side-by-side{grid-template-columns:1fr}}
@media(max-width:650px){body{font-size:14px}.legacy-brand-title{font-size:16px}.legacy-section-head{font-size:16px}.legacy-item{font-size:15px;min-height:47px}.legacy-page-head h1{font-size:22px}.legacy-grid,.legacy-field-groups{grid-template-columns:1fr}.legacy-full{grid-column:auto}.legacy-field label{font-size:16px}.legacy-field input,.legacy-field select,.legacy-field textarea{min-height:50px;border-radius:14px}.legacy-card{padding:13px;border-radius:11px}.legacy-card h2{font-size:19px}.legacy-field-list{display:block}.legacy-check{margin-bottom:7px}.legacy-search{min-width:0!important}.legacy-sticky .legacy-btn{flex:1}.legacy-table{min-width:680px}}
</style>
<script>
function legacyOpenMenu(){document.querySelector('.legacy-sidebar')?.classList.add('open');document.querySelector('.legacy-drawer-overlay')?.classList.add('open');document.body.style.overflow='hidden'}
function legacyCloseMenu(){document.querySelector('.legacy-sidebar')?.classList.remove('open');document.querySelector('.legacy-drawer-overlay')?.classList.remove('open');document.body.style.overflow=''}
window.addEventListener('keydown',e=>{if(e.key==='Escape')legacyCloseMenu()});window.addEventListener('resize',()=>{if(window.innerWidth>1000)legacyCloseMenu()});

// ربط عناصر قسم الشرائح والوايرلس مباشرة بكتالوج الباقات والفئات في Django.
document.addEventListener('DOMContentLoaded',()=>{
  const base='/admin/dashboard/services/resources/';
  const routes={
    'فئات YOU':`${base}?type=denom&service_code=you-denomination`,
    'باقات YOU':`${base}?type=plan&service_code=you-offer`,
    'فئات يمن موبايل':`${base}?type=denom&service_code=yem-denomination`,
    'باقات يمن موبايل':`${base}?type=plan&service_code=yem-offer`,
    'باقات الانترنت':`${base}?type=plan`,
    'باقات يمن فورجي':`${base}?type=plan&service_code=yem4g-package`,
    'باقات واي':`${base}?type=plan&service_code=why-package`,
    'كروت الشبكات':`${base}?type=denom`,
    'واي':`${base}?type=plan&service_code=why-package`,
  };
  document.querySelectorAll('.legacy-sidebar .legacy-item').forEach((item)=>{
    const label=item.querySelector('.menu-label')?.textContent.trim();
    const href=routes[label];
    if(!href)return;
    if(item.tagName.toLowerCase()!=='a'){
      const a=document.createElement('a');
      a.className=item.className;
      while(item.firstChild)a.appendChild(item.firstChild);
      item.replaceWith(a);
      item=a;
    }
    item.href=href;
  });

  // قسم واحد موحد للألعاب والبطائق والبرامج.
  const menu=document.querySelector('.legacy-menu');
  if(menu && !document.getElementById('legacy-games-cards-section')){
    const section=document.createElement('details');
    section.id='legacy-games-cards-section';
    section.className='legacy-menu-section';
    section.open=true;
    section.innerHTML='<summary class="legacy-section-head"><span>قسم الألعاب والبطائق</span><span class="chev">⌄</span></summary><a class="legacy-item" href="'+base+'?type=entertainment"><span class="menu-icon">🎮</span><span class="menu-label">فئات الألعاب والبطائق</span></a>';
    const wireless=[...menu.querySelectorAll('.legacy-menu-section')].find(d=>d.querySelector('.legacy-section-head')?.textContent.includes('قسم الوايرلس'));
    menu.insertBefore(section,wireless||null);
  }
});
</script>
