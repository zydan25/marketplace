name: Generate domain migration state

on:
  push:
    branches:
      - refactor/physical-domain-separation

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: migration-generator-only
      DJANGO_DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Generate migrations
        working-directory: backend
        run: python manage.py makemigrations --noinput
      - name: Package generated migrations
        working-directory: backend
        run: tar -czf /tmp/domain-migrations.tgz marketplace/migrations accounts/migrations catalog/migrations vendors/migrations storefront/migrations orders/migrations finance/migrations communication/migrations promotions/migrations
      - name: Upload generated migrations
        uses: actions/upload-artifact@v4
        with:
          name: generated-domain-migrations
          path: /tmp/domain-migrations.tgz
          if-no-files-found: error
