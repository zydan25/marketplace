name: Build Preview APKs

on:
  workflow_dispatch:
  push:
    branches:
      - "work/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [customer, vendor]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: 10e0228e-8424-4fc5-9399-9c4f8bfb8a95
      EAS_PROJECT_OWNER: zydan2626
      EAS_PROJECT_SLUG: shbyk-lbyk
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout current branch/PR
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public > /tmp/expo-config-${{ matrix.variant }}.json

      - name: Validate TypeScript
        run: pnpm check

      - name: Check EAS credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN is missing from GitHub Actions secrets."; exit 1; }

      - name: Submit preview build to EAS
        run: pnpm dlx eas-cli@latest build --platform android --profile ${{ matrix.variant }} --non-interactive --no-wait

      - name: Write build metadata
        run: |
          mkdir -p artifacts
          printf 'variant=%s\ncommit=%s\n' "${{ matrix.variant }}" "$GITHUB_SHA" > "artifacts/${{ matrix.variant }}-preview.txt"

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-preview-metadata
          path: artifacts/${{ matrix.variant }}-preview.txt
          if-no-files-found: error
          retention-days: 14
