name: Build and Deploy ERP Dashboard to GitHub Pages

on:
  push:
    branches: [feat/erp-style-unified-admin-2026-09]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: erp-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: erp-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean build
        uses: actions/checkout@v4

      - name: Prepare production preview
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/index.html
          rm -rf dist
          mkdir -p dist
          cp -R preview/. dist/
          cp dist/index.html dist/404.html
          test -s dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
