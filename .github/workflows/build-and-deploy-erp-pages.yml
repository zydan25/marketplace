name: Build & Deploy ERP Dashboard Preview

on:
  push:
    branches:
      - feat/erp-style-unified-admin-2026-09
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erp-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build ERP Dashboard Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build preview package
        shell: bash
        run: |
          set -euo pipefail
          test -f preview/index.html
          test -s preview/index.html
          mkdir -p build/erp-dashboard
          cp -R preview/. build/erp-dashboard/
          test -s build/erp-dashboard/index.html
          echo "ERP dashboard preview build completed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-dashboard-preview
          path: build/erp-dashboard
          if-no-files-found: error

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/erp-dashboard
          force_orphan: true
          commit_message: "Deploy ERP dashboard preview ${{ github.sha }}"
