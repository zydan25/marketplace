name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "نسخة التطبيق المطلوب بناؤها"
        required: true
        default: both
        type: choice
        options:
          - customer
          - vendor
          - both

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [customer, vendor]
    if: ${{ inputs.variant == 'both' || inputs.variant == matrix.variant }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: ${{ matrix.variant }}
      EAS_PROJECT_OWNER: zydan2626
      EAS_PROJECT_SLUG: shabik-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve EAS project ID
        run: node scripts/resolve-eas-project.mjs

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public > /tmp/expo-config.json

      - name: Validate TypeScript
        run: pnpm check

      - name: Build APK with EAS
        run: pnpm dlx eas-cli@latest build --platform android --profile ${{ matrix.variant }} --non-interactive --no-wait
