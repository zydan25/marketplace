name: Import flutter-katolin

on:
  push:
    paths:
      - '.github/workflows/import-flutter-katolin.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone public source project
        run: git clone --depth 1 --branch main https://github.com/zydan25/flutter_shopik44.git /tmp/flutter_shopik44

      - name: Copy source into flutter-katolin
        run: |
          rm -rf flutter-katolin
          mkdir -p flutter-katolin
          cp -a /tmp/flutter_shopik44/. flutter-katolin/
          rm -rf flutter-katolin/.git

      - name: Commit imported project and remove importer workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-flutter-katolin.yml
          git add -A flutter-katolin .github/workflows/import-flutter-katolin.yml
          git commit -m "feat: import flutter_shopik44 into flutter-katolin"
          git push origin main
