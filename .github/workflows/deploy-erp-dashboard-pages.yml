name: Deploy ERP Dashboard Preview to GitHub Pages

on:
  push:
    branches:
      - feat/erp-style-unified-admin-2026-09
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./preview
          force_orphan: true
          commit_message: "Deploy ERP dashboard preview"
