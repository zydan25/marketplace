name: Fix inner action menus

on:
  push:
    branches:
      - feat/erp-control-current-shell-2026-09

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: hide inner action menus')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/erp-control-current-shell-2026-09
          fetch-depth: 1
      - name: Hide menus until the three-dot button is pressed
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('backend/templates/admin/control/inner/stores.html'),
              Path('backend/templates/admin/control/inner/products.html'),
          ]
          replacements = [
              ('.more-menu{position:', '.more-menu{display:none;position:'),
              ('.more-menu a,.more-menu button{', '.more-menu.open{display:block}.more-menu a,.more-menu button{'),
              ('.product-more-menu{position:', '.product-more-menu{display:none;position:'),
              ('.product-more-menu a,.product-more-menu button{', '.product-more-menu.open{display:block}.product-more-menu a,.product-more-menu button{'),
          ]
          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              print('No menu CSS changes were necessary.')
          else:
              print('Updated:', ', '.join(changed))
          PY
      - name: Commit menu fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/templates/admin/control/inner/stores.html backend/templates/admin/control/inner/products.html
          git diff --cached --quiet || git commit -m "fix: hide inner action menus"
          git push origin HEAD:feat/erp-control-current-shell-2026-09
