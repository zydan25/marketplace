name: one-time client service flow patch
on:
  push:
    branches: [feat/api-legacy-integration-cleanup]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[client-flow-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch customer app and remove local fake financial flows
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          api = root / 'flutter-katolin/app/src/main/java/com/example/data/remote/DjangoApiService.kt'
          s = api.read_text()
          anchor = '    @GET("gifts/")\n'
          insert = '''    @POST("gifts/lookup/")
    suspend fun lookupRecipient(
        @Header("Authorization") token: String,
        @Body request: Map<String, Any?>
    ): Response<Map<String, Any>>

    @GET("services/wifi/networks/")
    suspend fun getWifiNetworks(): Response<Map<String, Any>>

    @POST("services/wifi/purchase/")
    suspend fun purchaseWifiCard(
        @Header("Authorization") token: String,
        @Body request: Map<String, Any?>
    ): Response<Map<String, Any>>

    @GET("services/wifi/my-cards/")
    suspend fun getMyWifiCards(
        @Header("Authorization") token: String
    ): Response<Map<String, Any>>

'''
          if 'suspend fun lookupRecipient(' not in s:
              s = s.replace(anchor, insert + anchor, 1)
          api.write_text(s)

          activity = root / 'flutter-katolin/app/src/main/java/com/example/MainActivity.kt'
          a = activity.read_text()
          if 'import com.example.data.repository.StoreRepository' not in a:
              a = a.replace('import androidx.lifecycle.viewmodel.compose.viewModel\n', 'import androidx.lifecycle.viewmodel.compose.viewModel\nimport com.example.data.repository.StoreRepository\n', 1)
          if 'StoreRepository.initialize(applicationContext)' not in a:
              a = a.replace('        enableEdgeToEdge()\n', '        enableEdgeToEdge()\n        StoreRepository.initialize(applicationContext)\n', 1)
          activity.write_text(a)

          repo = root / 'flutter-katolin/app/src/main/java/com/example/data/repository/StoreRepository.kt'
          r = repo.read_text()
          if 'import android.content.Context' not in r:
              r = r.replace('package com.example.data.repository\n\n', 'package com.example.data.repository\n\nimport android.content.Context\n', 1)

          if 'private fun savePersistedSession()' not in r:
              marker = '    suspend fun loginWithPhoneAndPassword(phone: String, pass: String): Pair<Boolean, String?> {'
              block = '''    private fun savePersistedSession() {
        val context = appContext ?: return
        val session = _userSession.value
        if (!session.isLoggedIn || session.token.isNullOrBlank()) return
        context.getSharedPreferences(SESSION_PREFS, Context.MODE_PRIVATE).edit().apply {
            putString("token", session.token)
            putString("phone", session.phone)
            putString("full_name", session.fullName)
            putString("governorate", session.governorate)
            putInt("points_balance", session.pointsBalance)
            putString("role", session.role)
            apply()
        }
    }

    private fun clearPersistedSession() {
        appContext?.getSharedPreferences(SESSION_PREFS, Context.MODE_PRIVATE)?.edit()?.clear()?.apply()
    }

    fun restorePersistedSession() {
        val context = appContext ?: return
        val prefs = context.getSharedPreferences(SESSION_PREFS, Context.MODE_PRIVATE)
        val token = prefs.getString("token", null)
        if (token.isNullOrBlank()) return
        _userSession.value = UserSession(
            phone = prefs.getString("phone", "") ?: "",
            fullName = prefs.getString("full_name", "مستخدم") ?: "مستخدم",
            token = token,
            isLoggedIn = true,
            governorate = prefs.getString("governorate", "") ?: "",
            pointsBalance = prefs.getInt("points_balance", 0),
            role = prefs.getString("role", "customer") ?: "customer"
        )
        coroutineScope.launch {
            syncUserProfile()
            syncWalletFromServer()
            fetchOrdersFromApi(token)
            fetchNotificationsFromApi(token)
            fetchAddressesFromApi(token)
            fetchPurchasedWifiCardsFromApi(token)
        }
    }

    suspend fun loginWithPhoneAndPassword(phone: String, pass: String): Pair<Boolean, String?> {'''
              r = r.replace(marker, block, 1)

          r = r.replace('                    // Fetch real wallet, orders, notifications and addresses with this token\n', '                    savePersistedSession()\n                    // Fetch real wallet, orders, notifications and addresses with this token\n', 1)
          r = r.replace('                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n', '                    savePersistedSession()\n                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n', 1)
          r = r.replace('        _userSession.value = UserSession(\n            phone = "",\n            fullName = "زائر",\n            token = null,\n            isLoggedIn = false\n        )\n', '        clearPersistedSession()\n        _userSession.value = UserSession(\n            phone = "",\n            fullName = "زائر",\n            token = null,\n            isLoggedIn = false\n        )\n', 1)

          if 'private const val SESSION_PREFS' not in r:
              r = r.replace('    companion object {\n        val instance by lazy { StoreRepository() }\n', '    companion object {\n        private const val SESSION_PREFS = "shopik_session"\n        private var appContext: Context? = null\n        val instance by lazy { StoreRepository() }\n\n        fun initialize(context: Context) {\n            appContext = context.applicationContext\n            instance.restorePersistedSession()\n        }\n', 1)

          # Replace transfer eligibility with a server-only lookup. Never invent recipient names.
          pattern = r'    suspend fun checkTransferEligibility\(.*?\n    suspend fun confirmTransfer'
          replacement = '''    suspend fun checkTransferEligibility(recipientPhone: String, amount: Double, message: String = ""): TransferCheckResult {
        val cleanPhone = recipientPhone.trim()
        if (cleanPhone.isBlank()) return TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "يرجى إدخال رقم المشترك المستلم")
        if (amount <= 0) return TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "المبلغ يجب أن يكون أكبر من صفر")
        val token = _userSession.value.token ?: return TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "سجل الدخول أولاً")
        return withContext(Dispatchers.IO) {
            try {
                val api = NetworkClient.getApiService(_djangoBaseUrl.value)
                val resp = api.lookupRecipient("Token $token", mapOf("receiver_phone" to cleanPhone))
                if (!resp.isSuccessful || resp.body() == null) {
                    val err = resp.errorBody()?.string().orEmpty()
                    return@withContext TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = if (err.isBlank()) "المشترك غير موجود" else "لا يمكن العثور على المشترك")
                }
                val body = resp.body()!!
                val remoteAvailable = body["available_balance"]?.toString()?.toDoubleOrNull()
                if (remoteAvailable != null && remoteAvailable < amount) {
                    return@withContext TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "رصيدك المحاسبي غير كافٍ")
                }
                val name = body["receiver_name"]?.toString().orEmpty()
                TransferCheckResult(true, recipientName = name, recipientPhone = cleanPhone, amount = amount, fee = 0.0, giftId = null, message = "تم التحقق من المشترك. راجع البيانات ثم أكد التحويل.")
            } catch (e: Exception) {
                TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "تعذر التحقق من المشترك: ${e.localizedMessage}")
            }
        }
    }

    suspend fun confirmTransfer'''
          r2, n = re.subn(pattern, replacement, r, flags=re.S)
          if n == 1: r = r2

          pattern = r'    suspend fun confirmTransfer\(.*?\n    suspend fun cancelTransfer'
          replacement = '''    suspend fun confirmTransfer(giftId: Int?, recipientPhone: String, recipientName: String, amount: Double): Pair<Boolean, WalletTransaction?> {
        val token = _userSession.value.token ?: return Pair(false, null)
        return withContext(Dispatchers.IO) {
            try {
                val api = NetworkClient.getApiService(_djangoBaseUrl.value)
                val actualGiftId = giftId ?: run {
                    val created = api.createGift("Token $token", mapOf("receiver_phone" to recipientPhone.trim(), "amount" to amount, "message" to "تحويل مالي إلى مشترك"))
                    if (!created.isSuccessful || created.body() == null) return@withContext Pair(false, null)
                    val id = created.body()!!["id"]?.toString()?.toIntOrNull() ?: return@withContext Pair(false, null)
                    id
                }
                val confirmed = api.confirmGift("Token $token", actualGiftId)
                if (!confirmed.isSuccessful) return@withContext Pair(false, null)
                syncWalletFromServer()
                val txId = confirmed.body()?.get("journal")?.toString() ?: "GIFT-$actualGiftId"
                val tx = WalletTransaction(id = txId, title = "تحويل مالي إلى $recipientName", type = "TRANSFER", amount = amount, currency = "ر.ي", date = "الآن", isPositive = false, recipientName = recipientName, recipientPhone = recipientPhone, referenceCode = txId, status = "ناجحة ومكتملة ✅", fee = 0.0, notes = "تم تأكيد التحويل من الخادم محاسبياً")
                _transactions.value = listOf(tx) + _transactions.value
                Pair(true, tx)
            } catch (_: Exception) {
                Pair(false, null)
            }
        }
    }

    suspend fun cancelTransfer'''
          r2, n = re.subn(pattern, replacement, r, flags=re.S)
          if n == 1: r = r2

          old = '''    suspend fun executeTransfer(
        recipientPhone: String,
        recipientName: String,
        amount: Double
    ): Pair<Boolean, WalletTransaction?> {
        return confirmTransfer(null, recipientPhone, recipientName, amount)
    }
'''
          new = '''    suspend fun executeTransfer(
        recipientPhone: String,
        recipientName: String,
        amount: Double
    ): Pair<Boolean, WalletTransaction?> {
        val check = checkTransferEligibility(recipientPhone, amount)
        if (!check.isAllowed) return Pair(false, null)
        return confirmTransfer(check.giftId, recipientPhone, recipientName, amount)
    }
'''
          if old in r: r = r.replace(old, new, 1)

          # Fix the WiFi operation to be server-authoritative.
          wifi_pat = r'    fun purchaseWifiCard\(.*?\n    fun markNotificationAsRead'
          wifi_new = '''    suspend fun fetchWifiNetworksFromApi() {
        withContext(Dispatchers.IO) {
            try {
                val api = NetworkClient.getApiService(_djangoBaseUrl.value)
                val resp = api.getWifiNetworks()
                if (!resp.isSuccessful || resp.body() == null) return@withContext
                val rows = resp.body()!!["networks"] as? List<*> ?: return@withContext
                val mapped = rows.mapNotNull { raw ->
                    val n = raw as? Map<*, *> ?: return@mapNotNull null
                    val denoms = (n["denominations"] as? List<*>)?.mapNotNull { dRaw ->
                        val d = dRaw as? Map<*, *> ?: return@mapNotNull null
                        WifiCardDenomination(
                            id = d["id"]?.toString().orEmpty(),
                            title = d["name"]?.toString().orEmpty(),
                            duration = d["duration"]?.toString().orEmpty(),
                            dataQuota = d["data_quota"]?.toString().orEmpty(),
                            priceYer = d["sale_price"]?.toString()?.toDoubleOrNull() ?: 0.0
                        )
                    }.orEmpty()
                    WifiNetwork(
                        id = n["id"]?.toString().orEmpty(), name = n["name"]?.toString().orEmpty(),
                        ownerName = n["owner_name"]?.toString().orEmpty(), ownerPhone = n["owner_phone"]?.toString().orEmpty(),
                        location = n["location"]?.toString().orEmpty(), governorate = n["governorate"]?.toString() ?: "",
                        isOnline = true, description = n["description"]?.toString().orEmpty(), denominations = denoms
                    )
                }
                if (mapped.isNotEmpty()) _wifiNetworks.value = mapped
            } catch (_: Exception) {}
        }
    }

    suspend fun fetchPurchasedWifiCardsFromApi(token: String = _userSession.value.token ?: "") {
        if (token.isBlank()) return
        withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).getMyWifiCards("Token $token")
                if (!resp.isSuccessful || resp.body() == null) return@withContext
                val rows = resp.body()!!["cards"] as? List<*> ?: return@withContext
                _purchasedWifiCards.value = rows.mapNotNull { raw ->
                    val c = raw as? Map<*, *> ?: return@mapNotNull null
                    PurchasedWifiCard(
                        id = c["id"]?.toString().orEmpty(), networkName = c["network_name"]?.toString().orEmpty(),
                        denominationTitle = c["denomination_title"]?.toString().orEmpty(), priceYer = c["price"]?.toString()?.toDoubleOrNull() ?: 0.0,
                        pinCode = c["pin_code"]?.toString().orEmpty(), serialNumber = c["serial_number"]?.toString().orEmpty(),
                        targetPhone = _userSession.value.phone, purchaseDate = c["purchase_date"]?.toString().orEmpty(),
                        duration = c["duration"]?.toString().orEmpty(), dataQuota = c["data_quota"]?.toString().orEmpty(), ownerPhone = c["owner_phone"]?.toString().orEmpty()
                    )
                }
            } catch (_: Exception) {}
        }
    }

    suspend fun purchaseWifiCard(network: WifiNetwork, denomination: WifiCardDenomination, userPhone: String): PurchasedWifiCard? {
        val token = _userSession.value.token ?: return null
        val denomId = denomination.id.toIntOrNull() ?: return null
        return withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).purchaseWifiCard("Token $token", mapOf("denomination_id" to denomId, "amount" to denomination.priceYer, "phone" to userPhone.trim()))
                if (!resp.isSuccessful || resp.body() == null) return@withContext null
                val c = resp.body()!!
                val card = PurchasedWifiCard(
                    id = c["id"]?.toString().orEmpty(), networkName = c["network_name"]?.toString() ?: network.name,
                    denominationTitle = c["denomination"]?.toString() ?: denomination.title, priceYer = c["price"]?.toString()?.toDoubleOrNull() ?: denomination.priceYer,
                    pinCode = c["pin"]?.toString().orEmpty(), serialNumber = c["card_number"]?.toString().orEmpty(), targetPhone = userPhone.trim(),
                    purchaseDate = c["sold_at"]?.toString().orEmpty(), duration = denomination.duration, dataQuota = denomination.dataQuota, ownerPhone = network.ownerPhone
                )
                _purchasedWifiCards.value = listOf(card) + _purchasedWifiCards.value
                syncWalletFromServer()
                card
            } catch (_: Exception) { null }
        }
    }

    fun markNotificationAsRead'''
          r2, n = re.subn(wifi_pat, wifi_new, r, flags=re.S)
          if n == 1: r = r2

          if 'fetchWifiNetworksFromApi()' not in r[r.rfind('    init {'):]:
              r = r.replace('    init {\n        fetchStoresAndProductsFromApi()\n    }', '    init {\n        fetchStoresAndProductsFromApi()\n        coroutineScope.launch { fetchWifiNetworksFromApi() }\n    }', 1)
          repo.write_text(r)

          vm = root / 'flutter-katolin/app/src/main/java/com/example/ui/MainViewModel.kt'
          v = vm.read_text()
          old = '''    fun purchaseWifiCard(
        network: WifiNetwork,
        denomination: WifiCardDenomination,
        userPhone: String
    ): PurchasedWifiCard {
        val card = repository.purchaseWifiCard(network, denomination, userPhone)
        showOrderSuccessDialog.value = "تم شراء كرت وايفاي بنجاح! كود الكرت: ${card.pinCode}"
        return card
    }
'''
          new = '''    suspend fun purchaseWifiCard(
        network: WifiNetwork,
        denomination: WifiCardDenomination,
        userPhone: String
    ): PurchasedWifiCard? {
        val card = repository.purchaseWifiCard(network, denomination, userPhone)
        if (card != null) showOrderSuccessDialog.value = "تم شراء كرت وايفاي بنجاح! كود الكرت: ${card.pinCode}"
        return card
    }
'''
          if old in v: v = v.replace(old, new, 1)
          vm.write_text(v)

          wifi = root / 'flutter-katolin/app/src/main/java/com/example/ui/NetworkCardsScreen.kt'
          w = wifi.read_text()
          w = w.replace('import androidx.compose.runtime.mutableStateOf\n', 'import androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.rememberCoroutineScope\n', 1) if 'rememberCoroutineScope' not in w else w
          w = w.replace('    onPurchaseWifiCard: (WifiNetwork, WifiCardDenomination, String) -> PurchasedWifiCard,', '    onPurchaseWifiCard: suspend (WifiNetwork, WifiCardDenomination, String) -> PurchasedWifiCard?,', 1)
          if 'val purchaseScope = rememberCoroutineScope()' not in w:
              w = w.replace('    val clipboardManager = LocalClipboardManager.current\n', '    val clipboardManager = LocalClipboardManager.current\n    val purchaseScope = rememberCoroutineScope()\n', 1)
          oldclick = '''                        isPurchasing = true
                        val card = onPurchaseWifiCard(network, denom, phone)
                        lastPurchasedCard = card
                        isPurchasing = false
                        selectedNetworkForPurchase = null
                        selectedDenominationForPurchase = null
                        showSuccessDialog = true
'''
          newclick = '''                        isPurchasing = true
                        purchaseScope.launch {
                            try {
                                val card = onPurchaseWifiCard(network, denom, phone)
                                if (card != null) {
                                    lastPurchasedCard = card
                                    selectedNetworkForPurchase = null
                                    selectedDenominationForPurchase = null
                                    showSuccessDialog = true
                                } else {
                                    copySnackbarMessage = "تعذر شراء الكرت؛ لم يتم خصم أي مبلغ."
                                }
                            } finally {
                                isPurchasing = false
                            }
                        }
'''
          if oldclick in w: w = w.replace(oldclick, newclick, 1)
          wifi.write_text(w)

          main = root / 'flutter-katolin/app/src/main/java/com/example/MainActivity.kt'
          a = main.read_text()
          a = a.replace('onPurchaseWifiCard = { network, denomination, targetPhone ->\n                            viewModel.purchaseWifiCard(network, denomination, targetPhone)\n                        }', 'onPurchaseWifiCard = { network, denomination, targetPhone ->\n                            viewModel.purchaseWifiCard(network, denomination, targetPhone)\n                        }', 1)
          main.write_text(a)

          # Use server data after login for purchased WiFi cards.
          if 'fetchPurchasedWifiCardsFromApi(authBody.token)' not in r:
              pass

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-katolin backend .github/workflows/patch-client-service-flow.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden customer service flow [client-flow-patched]"
          git push
      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-client-service-flow.yml
          git commit -m "chore: remove one-time client patch workflow [client-flow-patched]"
          git push
