name: Katolin Android CI

on:
  push:
    branches: ["feat/**", "work/**", "refactor/**", "main"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Katolin Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-katolin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Repair PaymentNetworkScreen Kotlin syntax
        working-directory: .
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("flutter-katolin/app/src/main/java/com/example/ui/PaymentNetworkScreen.kt")
          s = p.read_text(encoding="utf-8")
          replacements = {
              '''private fun providerColor(provider: ServiceCategoryDto?): Color = when {\n    providerMatches(provider ?: return YemenMobilePink, ProviderKind.YEMEN_MOBILE) -> YemenMobilePink\n    providerMatches(provider, ProviderKind.SABAFON) -> SabafonBlue\n    providerMatches(provider, ProviderKind.YOU) -> YouYellow\n    providerMatches(provider, ProviderKind.WHY) -> WhyPurple\n    providerMatches(provider, ProviderKind.FOUR_G) -> FourGBlue\n    providerMatches(provider, ProviderKind.YEMEN_NET) -> YemenNetPurple\n    else -> ControlBlue\n}''': '''private fun providerColor(provider: ServiceCategoryDto?): Color {\n    if (provider == null) return ControlBlue\n    return when {\n        providerMatches(provider, ProviderKind.YEMEN_MOBILE) -> YemenMobilePink\n        providerMatches(provider, ProviderKind.SABAFON) -> SabafonBlue\n        providerMatches(provider, ProviderKind.YOU) -> YouYellow\n        providerMatches(provider, ProviderKind.WHY) -> WhyPurple\n        providerMatches(provider, ProviderKind.FOUR_G) -> FourGBlue\n        providerMatches(provider, ProviderKind.YEMEN_NET) -> YemenNetPurple\n        else -> ControlBlue\n    }\n}''',
              '''private fun providerTitle(provider: ServiceCategoryDto?): String = when {\n    providerMatches(provider ?: return "شبكة السداد", ProviderKind.YEMEN_MOBILE) -> "Yemen Mobile"\n    providerMatches(provider, ProviderKind.SABAFON) -> "سبأفون"\n    providerMatches(provider, ProviderKind.YOU) -> "YOU"\n    providerMatches(provider, ProviderKind.WHY) -> "WHY"\n    providerMatches(provider, ProviderKind.FOUR_G) -> "Yemen 4G"\n    providerMatches(provider, ProviderKind.YEMEN_NET) -> "Yemen Net"\n    else -> provider.name.ifBlank { "شبكة السداد" }\n}''': '''private fun providerTitle(provider: ServiceCategoryDto?): String {\n    if (provider == null) return "شبكة السداد"\n    return when {\n        providerMatches(provider, ProviderKind.YEMEN_MOBILE) -> "Yemen Mobile"\n        providerMatches(provider, ProviderKind.SABAFON) -> "سبأفون"\n        providerMatches(provider, ProviderKind.YOU) -> "YOU"\n        providerMatches(provider, ProviderKind.WHY) -> "WHY"\n        providerMatches(provider, ProviderKind.FOUR_G) -> "Yemen 4G"\n        providerMatches(provider, ProviderKind.YEMEN_NET) -> "Yemen Net"\n        else -> provider.name.ifBlank { "شبكة السداد" }\n    }\n}''',
              '''private fun providerMark(provider: ServiceCategoryDto?): String = when {\n    providerMatches(provider ?: return "K", ProviderKind.YEMEN_MOBILE) -> "YM"\n    providerMatches(provider, ProviderKind.SABAFON) -> "S"\n    providerMatches(provider, ProviderKind.YOU) -> "YOU"\n    providerMatches(provider, ProviderKind.WHY) -> "WHY"\n    providerMatches(provider, ProviderKind.FOUR_G) -> "4G"\n    providerMatches(provider, ProviderKind.YEMEN_NET) -> "YN"\n    else -> "K"\n}''': '''private fun providerMark(provider: ServiceCategoryDto?): String {\n    if (provider == null) return "K"\n    return when {\n        providerMatches(provider, ProviderKind.YEMEN_MOBILE) -> "YM"\n        providerMatches(provider, ProviderKind.SABAFON) -> "S"\n        providerMatches(provider, ProviderKind.YOU) -> "YOU"\n        providerMatches(provider, ProviderKind.WHY) -> "WHY"\n        providerMatches(provider, ProviderKind.FOUR_G) -> "4G"\n        providerMatches(provider, ProviderKind.YEMEN_NET) -> "YN"\n        else -> "K"\n    }\n}''',
              '''private fun isYemenNet(provider: ServiceCategoryDto?): Boolean =\n    providerMatches(provider ?: return false, ProviderKind.YEMEN_NET)''': '''private fun isYemenNet(provider: ServiceCategoryDto?): Boolean =\n    providerMatches(provider, ProviderKind.YEMEN_NET)''',
              '''private fun isYemenMobile(provider: ServiceCategoryDto?): Boolean =\n    providerMatches(provider ?: return false, ProviderKind.YEMEN_MOBILE)''': '''private fun isYemenMobile(provider: ServiceCategoryDto?): Boolean =\n    providerMatches(provider, ProviderKind.YEMEN_MOBILE)''',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if changed:
              p.write_text(s, encoding="utf-8")
          PY

          if ! git diff --quiet -- flutter-katolin/app/src/main/java/com/example/ui/PaymentNetworkScreen.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flutter-katolin/app/src/main/java/com/example/ui/PaymentNetworkScreen.kt
            git commit -m "fix(katolin): repair provider helper expression bodies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: katolin-debug-apk
          path: flutter-katolin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
