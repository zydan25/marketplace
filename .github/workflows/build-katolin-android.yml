name: Katolin Android CI

on:
  push:
    branches: ["feat/**", "work/**", "refactor/**", "main"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Katolin Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-katolin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: katolin-debug-apk
          path: flutter-katolin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
