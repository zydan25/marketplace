name: Fix Katolin Build

on:
  push:
    branches: [feat/katolin-yemen-payment-ui]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Kotlin screen
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('flutter-katolin/app/src/main/java/com/example/ui/PaymentNetworkScreenV2.kt')
          s=p.read_text()
          s=s.replace('catalog=api.getServiceCatalog("Token $token").body()?.categories?:error("تعذر جلب الكتالوج")', 'catalog=api.getServiceCatalog("Token $token").body()?.categories ?: throw IllegalStateException("تعذر جلب الكتالوج")')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter-katolin/app/src/main/java/com/example/ui/PaymentNetworkScreenV2.kt
          git commit -m 'fix(katolin): avoid error symbol shadowing in payment screen' || exit 0
          git push
