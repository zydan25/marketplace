name: Export Katolin Source

on:
  push:
    branches:
      - feat/katolin-yemen-payment-ui

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Katolin source
        run: |
          mkdir -p export
          zip -qr export/katolin-source.zip flutter-katolin backend/services
      - uses: actions/upload-artifact@v4
        with:
          name: katolin-source
          path: export/katolin-source.zip
          retention-days: 1
