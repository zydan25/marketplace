name: fix client flow
on:
  push:
    branches:
      - feat/api-legacy-integration-cleanup
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[client-flow-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          api = root / 'flutter-katolin/app/src/main/java/com/example/data/remote/DjangoApiService.kt'
          s = api.read_text()
          if 'suspend fun lookupRecipient(' not in s:
              s = s.replace('    @GET("gifts/")', '''    @POST("gifts/lookup/")
    suspend fun lookupRecipient(@Header("Authorization") token: String, @Body request: Map<String, Any?>): Response<Map<String, Any>>

    @GET("v2/services/wifi/networks/")
    suspend fun getWifiNetworks(): Response<Map<String, Any>>

    @POST("v2/services/wifi/purchase/")
    suspend fun purchaseWifiCard(@Header("Authorization") token: String, @Body request: Map<String, Any?>): Response<Map<String, Any>>

    @GET("v2/services/wifi/my-cards/")
    suspend fun getMyWifiCards(@Header("Authorization") token: String): Response<Map<String, Any>>

    @GET("gifts/")''', 1)
          api.write_text(s)

          activity = root / 'flutter-katolin/app/src/main/java/com/example/MainActivity.kt'
          a = activity.read_text()
          if 'import com.example.data.repository.StoreRepository' not in a:
              a = a.replace('import androidx.lifecycle.viewmodel.compose.viewModel\n', 'import androidx.lifecycle.viewmodel.compose.viewModel\nimport com.example.data.repository.StoreRepository\n', 1)
          if 'StoreRepository.initialize(applicationContext)' not in a:
              a = a.replace('        enableEdgeToEdge()\n', '        enableEdgeToEdge()\n        StoreRepository.initialize(applicationContext)\n', 1)
          if 'SessionVault.save(this@MainActivity' not in a:
              a = a.replace('onLoginSubmit = { phone, password ->\n                            viewModel.login(phone, password)\n                        }', 'onLoginSubmit = { phone, password ->\n                            SessionVault.save(this@MainActivity, phone, password)\n                            viewModel.login(phone, password)\n                        }', 1)
          if 'SessionVault.clear(this@MainActivity)' not in a:
              a = a.replace('onLogoutClick = { viewModel.logout() }', 'onLogoutClick = { SessionVault.clear(this@MainActivity); viewModel.logout() }', 1)
          activity.write_text(a)

          repo = root / 'flutter-katolin/app/src/main/java/com/example/data/repository/StoreRepository.kt'
          r = repo.read_text()
          if 'fetchWifiNetworksFromApi' not in r:
              marker = '    fun markNotificationAsRead(id: String) {'
              block = '''    suspend fun fetchWifiNetworksFromApi() {
        withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).getWifiNetworks()
                if (!resp.isSuccessful || resp.body() == null) return@withContext
                val rows = resp.body()!!["networks"] as? List<*> ?: return@withContext
                val mapped = rows.mapNotNull { raw ->
                    val n = raw as? Map<*, *> ?: return@mapNotNull null
                    val denoms = (n["denominations"] as? List<*>)?.mapNotNull { rawD ->
                        val d = rawD as? Map<*, *> ?: return@mapNotNull null
                        WifiCardDenomination(d["id"]?.toString().orEmpty(), d["name"]?.toString().orEmpty(), d["duration"]?.toString().orEmpty(), d["data_quota"]?.toString().orEmpty(), d["sale_price"]?.toString()?.toDoubleOrNull() ?: 0.0)
                    }.orEmpty()
                    WifiNetwork(n["id"]?.toString().orEmpty(), n["name"]?.toString().orEmpty(), n["owner_name"]?.toString().orEmpty(), n["owner_phone"]?.toString().orEmpty(), n["location"]?.toString().orEmpty(), "", isOnline = true, description = n["description"]?.toString().orEmpty(), denominations = denoms)
                }
                if (mapped.isNotEmpty()) _wifiNetworks.value = mapped
            } catch (_: Exception) {}
        }
    }

    suspend fun fetchPurchasedWifiCardsFromApi(token: String = _userSession.value.token ?: "") {
        if (token.isBlank()) return
        withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).getMyWifiCards("Token $token")
                if (!resp.isSuccessful || resp.body() == null) return@withContext
                val rows = resp.body()!!["cards"] as? List<*> ?: return@withContext
                _purchasedWifiCards.value = rows.mapNotNull { raw ->
                    val c = raw as? Map<*, *> ?: return@mapNotNull null
                    PurchasedWifiCard(c["id"]?.toString().orEmpty(), c["network_name"]?.toString().orEmpty(), c["denomination_title"]?.toString().orEmpty(), c["price"]?.toString()?.toDoubleOrNull() ?: 0.0, c["pin_code"]?.toString().orEmpty(), c["serial_number"]?.toString().orEmpty(), _userSession.value.phone, c["purchase_date"]?.toString().orEmpty(), c["duration"]?.toString().orEmpty(), c["data_quota"]?.toString().orEmpty(), c["owner_phone"]?.toString().orEmpty())
                }
            } catch (_: Exception) {}
        }
    }

    suspend fun purchaseWifiCard(network: WifiNetwork, denomination: WifiCardDenomination, userPhone: String): PurchasedWifiCard? {
        val token = _userSession.value.token ?: return null
        val denomId = denomination.id.toIntOrNull() ?: return null
        return withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).purchaseWifiCard("Token $token", mapOf("denomination_id" to denomId, "amount" to denomination.priceYer, "phone" to userPhone.trim()))
                if (!resp.isSuccessful || resp.body() == null) return@withContext null
                val c = resp.body()!!
                val card = PurchasedWifiCard(c["id"]?.toString().orEmpty(), c["network_name"]?.toString() ?: network.name, c["denomination"]?.toString() ?: denomination.title, c["price"]?.toString()?.toDoubleOrNull() ?: denomination.priceYer, c["pin"]?.toString().orEmpty(), c["card_number"]?.toString().orEmpty(), userPhone.trim(), c["sold_at"]?.toString().orEmpty(), denomination.duration, denomination.dataQuota, network.ownerPhone)
                _purchasedWifiCards.value = listOf(card) + _purchasedWifiCards.value
                syncWalletFromServer()
                card
            } catch (_: Exception) { null }
        }
    }

''' + marker
              r = r.replace(marker, block, 1)

          # Remove fake recipient fallback and use server lookup only.
          pat = r'    suspend fun checkTransferEligibility\(.*?\n    suspend fun confirmTransfer'
          rep = '''    suspend fun checkTransferEligibility(recipientPhone: String, amount: Double, message: String = ""): TransferCheckResult {
        val cleanPhone = recipientPhone.trim()
        val token = _userSession.value.token
        if (cleanPhone.isBlank() || amount <= 0 || token.isNullOrBlank()) return TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "أدخل رقمًا صحيحًا وسجل الدخول أولاً")
        return withContext(Dispatchers.IO) {
            try {
                val resp = NetworkClient.getApiService(_djangoBaseUrl.value).lookupRecipient("Token $token", mapOf("receiver_phone" to cleanPhone))
                if (!resp.isSuccessful || resp.body() == null) return@withContext TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "المشترك غير موجود")
                val body = resp.body()!!
                val available = body["available_balance"]?.toString()?.toDoubleOrNull()
                if (available != null && available < amount) return@withContext TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "رصيدك غير كافٍ")
                TransferCheckResult(true, body["receiver_name"]?.toString(), cleanPhone, amount, 0.0, null, "تم التحقق من المشترك. راجع البيانات ثم أكد التحويل.")
            } catch (e: Exception) {
                TransferCheckResult(false, recipientPhone = cleanPhone, amount = amount, message = "تعذر التحقق من المشترك: ${e.localizedMessage}")
            }
        }
    }

    suspend fun confirmTransfer'''
          r, n = re.subn(pat, rep, r, count=1, flags=re.S)

          pat = r'    suspend fun confirmTransfer\(.*?\n    suspend fun cancelTransfer'
          rep = '''    suspend fun confirmTransfer(giftId: Int?, recipientPhone: String, recipientName: String, amount: Double): Pair<Boolean, WalletTransaction?> {
        val token = _userSession.value.token ?: return Pair(false, null)
        return withContext(Dispatchers.IO) {
            try {
                val api = NetworkClient.getApiService(_djangoBaseUrl.value)
                val id = giftId ?: run {
                    val created = api.createGift("Token $token", mapOf("receiver_phone" to recipientPhone.trim(), "amount" to amount, "message" to "تحويل مالي إلى مشترك"))
                    if (!created.isSuccessful || created.body() == null) return@withContext Pair(false, null)
                    created.body()!!["id"]?.toString()?.toIntOrNull() ?: return@withContext Pair(false, null)
                }
                val confirmed = api.confirmGift("Token $token", id)
                if (!confirmed.isSuccessful) return@withContext Pair(false, null)
                syncWalletFromServer()
                val ref = confirmed.body()?.get("journal")?.toString() ?: "GIFT-$id"
                val tx = WalletTransaction(ref, "تحويل مالي إلى $recipientName", "TRANSFER", amount, "ر.ي", "الآن", false, recipientName, recipientPhone, ref, "ناجحة ومكتملة ✅", 0.0, "تم تأكيد التحويل محاسبياً من الخادم")
                _transactions.value = listOf(tx) + _transactions.value
                Pair(true, tx)
            } catch (_: Exception) { Pair(false, null) }
        }
    }

    suspend fun cancelTransfer'''
          r, n2 = re.subn(pat, rep, r, count=1, flags=re.S)

          old = '''    suspend fun executeTransfer(
        recipientPhone: String,
        recipientName: String,
        amount: Double
    ): Pair<Boolean, WalletTransaction?> {
        return confirmTransfer(null, recipientPhone, recipientName, amount)
    }
'''
          new = '''    suspend fun executeTransfer(recipientPhone: String, recipientName: String, amount: Double): Pair<Boolean, WalletTransaction?> {
        val check = checkTransferEligibility(recipientPhone, amount)
        if (!check.isAllowed) return Pair(false, null)
        return confirmTransfer(check.giftId, recipientPhone, recipientName, amount)
    }
'''
          r = r.replace(old, new, 1)

          init_old = '''    init {
        fetchStoresAndProductsFromApi()
    }'''
          init_new = '''    init {
        fetchStoresAndProductsFromApi()
        coroutineScope.launch { fetchWifiNetworksFromApi() }
    }'''
          r = r.replace(init_old, init_new, 1)
          r = r.replace('                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n', '                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n                    fetchPurchasedWifiCardsFromApi(authBody.token)\n', 1)
          r = r.replace('                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n', '                    syncWalletFromServer()\n                    fetchOrdersFromApi(authBody.token)\n                    fetchPurchasedWifiCardsFromApi(authBody.token)\n', 1)
          repo.write_text(r)

          # Make the old synchronous WiFi callback suspend-aware.
          wifi = root / 'flutter-katolin/app/src/main/java/com/example/ui/NetworkCardsScreen.kt'
          w = wifi.read_text()
          if 'import androidx.compose.runtime.rememberCoroutineScope' not in w:
              w = w.replace('import androidx.compose.runtime.mutableStateOf\n', 'import androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.rememberCoroutineScope\n', 1)
          w = w.replace('onPurchaseWifiCard: (WifiNetwork, WifiCardDenomination, String) -> PurchasedWifiCard,', 'onPurchaseWifiCard: suspend (WifiNetwork, WifiCardDenomination, String) -> PurchasedWifiCard?,', 1)
          if 'val purchaseScope = rememberCoroutineScope()' not in w:
              w = w.replace('    val clipboardManager = LocalClipboardManager.current\n', '    val clipboardManager = LocalClipboardManager.current\n    val purchaseScope = rememberCoroutineScope()\n', 1)
          oldclick = '''                        isPurchasing = true
                        val card = onPurchaseWifiCard(network, denom, phone)
                        lastPurchasedCard = card
                        isPurchasing = false
                        selectedNetworkForPurchase = null
                        selectedDenominationForPurchase = null
                        showSuccessDialog = true
'''
          newclick = '''                        isPurchasing = true
                        purchaseScope.launch {
                            try {
                                val card = onPurchaseWifiCard(network, denom, phone)
                                if (card != null) {
                                    lastPurchasedCard = card
                                    selectedNetworkForPurchase = null
                                    selectedDenominationForPurchase = null
                                    showSuccessDialog = true
                                } else {
                                    copySnackbarMessage = "تعذر شراء الكرت؛ لم يتم خصم أي مبلغ."
                                }
                            } finally {
                                isPurchasing = false
                            }
                        }
'''
          if oldclick in w: w = w.replace(oldclick, newclick, 1)
          wifi.write_text(w)

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter-katolin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden customer flow [client-flow-patched]"
          git push
