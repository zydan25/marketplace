name: Marketplace CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test marketplace

  expo:
    name: Expo TypeScript and Web builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Build customer web
        run: pnpm build:web:customer
        env:
          EXPO_PUBLIC_DJANGO_API_URL: https://shopik.alattab.site
      - name: Build vendor web
        run: pnpm build:web:vendor
        env:
          EXPO_PUBLIC_DJANGO_API_URL: https://shopik.alattab.site
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-web-builds
          path: |
            dist-web/customer
            dist-web/vendor
          if-no-files-found: error
