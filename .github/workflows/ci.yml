name: Marketplace CI

on:
  push:
    branches: [main, "refactor/**", "work/**"]
  pull_request:
    branches: [main]

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q .
      - name: Django system check
        run: python manage.py check
      - name: Django deployment check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "0"
      - name: Verify migrations are committed
        run: python manage.py makemigrations --check
      - name: Verify domain migrations are database no-ops
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            "accounts:0002_delete_userpreference_userpreference"
            "catalog:0002_delete_catalogoption_delete_category_city_and_more"
            "vendors:0002_delete_vendorapplication_delete_vendorprofile_and_more"
            "storefront:0002_delete_designtheme_delete_storefrontmedia_and_more"
            "orders:0002_delete_inventoryreservation_delete_order_and_more"
            "finance:0002_delete_currencyrate_delete_vendorcityshipping_and_more"
            "communication:0002_delete_conversation_delete_message_and_more"
            "communication:0003_order_chats_domain"
            "promotions:0002_delete_address_delete_coupon_delete_couponredemption_and_more"
            "marketplace:0018_complete_domain_separation"
          )
          for spec in "${migrations[@]}"; do
            app="${spec%%:*}"
            migration="${spec#*:}"
            sql="$(python manage.py sqlmigrate "$app" "$migration")"
            if printf '%s\n' "$sql" | grep -Eiq 'CREATE[[:space:]]+(TABLE|INDEX)|DROP[[:space:]]+(TABLE|INDEX)|ALTER[[:space:]]+TABLE|ADD[[:space:]]+CONSTRAINT|DROP[[:space:]]+CONSTRAINT'; then
              echo "ERROR: $spec emits database DDL"
              printf '%s\n' "$sql"
              exit 1
            fi
            echo "OK: $spec is database-no-op"
          done
      - name: Show migration plan
        run: python manage.py migrate --plan
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run all Django tests
        run: python manage.py test marketplace accounts catalog vendors storefront orders finance communication promotions

  expo:
    name: Expo TypeScript and Web builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner Node
        run: |
          node --version
          npm --version
      - name: Install pnpm globally
        run: npm install --global pnpm@9.12.0
      - name: Verify pnpm
        run: pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Build customer web
        run: pnpm build:web:customer
        env:
          EXPO_PUBLIC_DJANGO_API_URL: https://shopik.alattab.site
      - name: Build vendor web
        run: pnpm build:web:vendor
        env:
          EXPO_PUBLIC_DJANGO_API_URL: https://shopik.alattab.site
      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-web-builds
          path: |
            dist-web/customer
            dist-web/vendor
          if-no-files-found: error
